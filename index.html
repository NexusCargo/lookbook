<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghana Lookbook</title>
<style>
:root{--forest:#0E4D34;--forest-dark:#0A3626;--gold:#F2B705;--faded-gold:#D9A63A;--terracotta:#B5471B;--clay:#8C3A16;--ink:#1B1812;--ivory:#EDE6D6;--cream:#F1EBDD;--muted:#8b8471;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);}
section{min-height:400px;position:relative;display:flex;align-items:center;justify-content:center;padding:60px 20px;background-size:cover;background-position:center;}
section::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:0;}
.content{position:relative;z-index:1;max-width:1200px;text-align:center;}
.editable{padding:20px;border-radius:8px;transition:all 0.3s;}
.editable h1{font-size:48px;margin:20px 0;color:var(--ivory);}
.editable h2{font-size:36px;margin:15px 0;color:var(--ivory);}
.editable h3{font-size:28px;margin:12px 0;color:var(--ivory);}
.editable p{font-size:16px;line-height:1.6;color:var(--ivory);}
.typewriter{animation:type 0.05s steps(40);}
@keyframes type{from{width:0;}to{width:100%;}}
</style>
</head>
<body>

<div id="pageContainer"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getFirestore, doc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

let db;

async function boot() {
  const config = await (await fetch('/api/config')).json();
  const app = initializeApp(config.firebaseConfig);
  db = getFirestore(app);
  
  onSnapshot(doc(db, 'lookbook-visual', 'page'), snapshot => {
    if (snapshot.exists()) {
      renderPage(snapshot.data());
    }
  });
}

function renderPage(pageData) {
  const container = document.getElementById('pageContainer');
  container.innerHTML = '';
  
  (pageData.sections || []).forEach(section => {
    if (!section.visible) return;
    
    const sectionEl = document.createElement('section');
    sectionEl.style.backgroundColor = section.bgColor;
    
    if (section.bgMedia) {
      sectionEl.style.backgroundImage = `url(${section.bgMedia})`;
    }
    
    const content = document.createElement('div');
    content.className = 'content editable';
    
    Object.entries(section.elements || {}).forEach(([key, value]) => {
      if (key.endsWith('_typewriter')) return;
      
      let el;
      if (key === 'title') {
        el = document.createElement('h2');
      } else if (key === 'eyebrow') {
        el = document.createElement('div');
        el.style.fontSize = '14px';
        el.style.textTransform = 'uppercase';
        el.style.letterSpacing = '2px';
      } else if (key === 'subtitle' || key === 'tagline') {
        el = document.createElement('p');
        el.style.fontSize = '18px';
      } else {
        el = document.createElement('p');
      }
      
      const useTypewriter = section.elements[key + '_typewriter'];
      if (useTypewriter) {
        el.innerHTML = `<span class="typewriter">${value}</span>`;
      } else {
        el.textContent = value;
      }
      
      content.appendChild(el);
    });
    
    sectionEl.appendChild(content);
    container.appendChild(sectionEl);
  });
}

boot().catch(console.error);
</script>

</body>
</html>
